# Gere o projeto com `xcodegen` (brew install xcodegen). O .xcodeproj não é versionado.
name: Lastro
options:
  bundleIdPrefix: app.lastro
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  LastroKit:
    path: Packages/LastroKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.30.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: $(LASTRO_TEAM_ID)

targets:
  Lastro:
    type: application
    platform: iOS
    sources:
      - path: Lastro
    dependencies:
      - package: LastroKit
      - package: Supabase
        product: Supabase
    entitlements:
      path: Lastro/Lastro.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lastro.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lastro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Para autorizar pagamentos acima do limite e esconder seus valores."
        INFOPLIST_KEY_NSCameraUsageDescription: "Para escanear cupons fiscais."
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Lastro/Info.plist
      properties:
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        LASTRO_DEMO: $(LASTRO_DEMO)

  LastroTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LastroTests]
    dependencies:
      - target: Lastro
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lastro.ios.tests

schemes:
  Lastro:
    build:
      targets:
        Lastro: all
    test:
      targets: [LastroTests]
      gatherCoverageData: true
